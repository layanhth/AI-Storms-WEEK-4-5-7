<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Interviewer</title>

<link rel="stylesheet" href="./style.css?v=3">

</head>


<body>

<div class="container">

<h1>AI Interviewer</h1>


<div id="setup">

<h2>Choose Interview Language</h2>


<div class="languages">

<button onclick="selectLanguage('arabic',this)">
<div>Arabic</div>
<div>العربية</div>
</button>


<button onclick="selectLanguage('english',this)">
<div>English</div>
<div>الإنجليزية</div>
</button>


<button onclick="selectLanguage('mixed',this)">
<div>Mixed</div>
<div>مزدوج</div>
</button>

</div>

<h2>Choose Job Role</h2>
<div class="job-role">

    <select id="job_role">

        <option value="Junior Data Scientist">
            Junior Data Scientist
        </option>

        <option value="Junior Financial Analyst">
            Junior Financial Analyst
        </option>

    </select>

</div>


<h3 id="selected">
No language selected
</h3>


<button class="start" onclick="startInterview()">

<div>Start the Interview</div>
<div>ابدأ المقابلة</div>

</button>


</div>



<div id="chat" class="hidden">


<div id="messages"></div>


<div class="input-area">

<textarea 
id="answer"
placeholder="Type your answer..."></textarea>


<button onclick="sendAnswer()">
Send
</button>


</div>


</div>


</div>


<div id="feedback" class="hidden">

<h1>Interview Feedback</h1>


<div class="feedback-cards">

<div class="feedback-card">

<h3>What went well</h3>

<ul id="strengths"></ul>

</div>


<div class="feedback-card">

<h3>Areas to Improve</h3>

<ul id="improvements"></ul>

</div>

</div>



<div class="feedback-section">

<h3>Technical & Professional Knowledge</h3>

<p id="technical"></p>


<h3>Communication</h3>

<p id="communication"></p>


<h3>Problem Solving</h3>

<p id="problem_solving"></p>


<h3>Summary</h3>

<p id="summary"></p>

</div>


<button class="start" onclick="location.reload()">

<div>Start New Interview</div>
<div>مقابلة جديدة</div>

</button>


</div>

<script src="./app.js?v=7"></script>



</body>

</html>
